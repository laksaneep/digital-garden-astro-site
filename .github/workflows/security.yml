name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so newly-disclosed CVEs in existing deps surface even with no commits.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload findings to the Security tab

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          # vuln = CVEs in deps (package-lock.json), secret = leaked keys/tokens,
          # misconfig = insecure IaC / Dockerfile / workflow settings.
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          # Report-only: the scan never fails the run. Findings are tracked in the
          # Security tab instead. (Set to "1" to also hard-fail as a gate.)
          exit-code: "0"

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() # upload even if the scan step errored
        with:
          sarif_file: trivy-results.sarif
